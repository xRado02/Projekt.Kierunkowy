<section>
  <div class="container d-flex justify-content-center align-items-center">
    <div class="register-card card shadow p-4">

      <div *ngIf="tokenValid === false" class="alert alert-danger text-center mb-0">
        <p>Link do resetu hasła wygasł lub jest nieprawidłowy.</p>
      </div>
      <div *ngIf="tokenValid === true">
        <div class="d-flex align-items-center text-center mb-3" >
          <img src="content/images/svg/smallLogo.svg" width="42" height="42" />
        </div>
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" novalidate>
          <div class="form-floating mb-3">
            <input type="password" id="password" class="form-control" placeholder="Hasło" formControlName="password" />
            <label for="password">Hasło</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword" />
            <label for="confirmPassword">Powtórz hasło</label>
          </div>
          <button type="submit" class="btn btn-dark w-100">
            Zresetuj
          </button>
        </form>
        <div *ngIf="countdown !== null" class="mt-3 text-center text-muted">
          Hasło zmienione, przekierowanie za {{ countdown }}
        </div>
      </div>  
    </div>
  </div>
</section>
